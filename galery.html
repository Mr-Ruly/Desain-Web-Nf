<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Hobi Saya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: url('https://i.pinimg.com/474x/a8/73/70/a87370f478b2e9c006198c65ac764b12.jpg') no-repeat center center/cover;
            color: #fff;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        /* Overlay agar teks lebih terlihat */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Overlay hitam transparan */
            z-index: 1;
        }

        h2 {
            font-size: 3em;
            margin-bottom: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
        }

        .gallery-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: auto;
            padding: 10px;
            position: relative;
            z-index: 2;
        }

        .gallery-item {
            flex: 1;
            max-width: 250px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            background: rgba(255, 255, 255, 0.2); /* Transparan */
            backdrop-filter: blur(5px);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item .caption {
            padding: 10px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: #fff;
            border-radius: 0 0 12px 12px;
            text-transform: uppercase;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .gallery-container {
                flex-wrap: wrap;
            }
            .gallery-item {
                max-width: 45%;
            }
        }

        @media (max-width: 768px) {
            .gallery-container {
                flex-direction: column;
                align-items: center;
            }
            .gallery-item {
                max-width: 80%;
            }
        }

    </style>
</head>
<body>

    <h2>Galeri Hobi Saya</h2>

    <div class="gallery-container">
        <div class="gallery-item">
            <img src="images/hobby1.jpeg" alt="Hobi 1">
            <div class="caption">Memancing</div>
        </div>
        <div class="gallery-item">
            <img src="images/hobby2.jpg" alt="Hobi 2">
            <div class="caption">Gaming</div>
        </div>
        <div class="gallery-item">
            <img src="images/hobby3.jpg" alt="Hobi 3">
            <div class="caption">Belajar</div>
        </div>
        <div class="gallery-item">
            <img src="images/hobby4.jpg" alt="Hobi 4">
            <div class="caption">Musik</div>
        </div>
    </div>

</body>
</html>
